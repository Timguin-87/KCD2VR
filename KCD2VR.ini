; KCD2VR V62.9 - Lua UI persistence + dialogue Y + experimental VRIK prebuild ladder
; Quest/Touch input + dedicated XR MIS menu + native dialogue-camera tests
; + controlled XR swapchain rebuild + semantic VRIK READ / bounded PREBUILD test ladder.
;
; IMPORTANT: the active world bridge is still MONO duplicated into both XR eyes.
; V58 does not claim true stereo. Native L/R render-target routing remains work.

[Settings]
Enabled = true
LogLevel = WARN

HeadPoseScale = 1.0
VrCameraBackOffsetMeters = 0.0
VrCameraHeightOffsetMeters = 0.0
ApplyHeadRotation = true
ApplyHeadPosition = true

; V61.50: the F7 menu "Fix head sync" checkbox controls this live.
; unchecked = 0 CACHED_XR, checked = 2 SYNC_NOW.
; Supplied test default is checked/mode 2. FPS cap remains independent/manual;
; headset testing found 84-85 game cap + mode 2 produced the smoothest 90-ish presentation.
VrPoseSourceMode = 2

; V62.9 hybrid persistent VR HUD. Core subtitle/dialogue/hint transforms still use
; the native FlashUI MovieClip path. The bundled optional KCD2VR_UI_LIVE Lua/HUD
; adapter re-pushes compass, health/stamina, quick slots, reticle and experimental
; ratio-strip state after HUD recreation. KCD2VR.ini is saved only by KCD2VR itself.
EnableVrUiLayout = true
VrUiSubtitleScale = 0.55
VrUiSubtitleY = 0
VrUiDialogueScale = 0.70
VrUiDialogueY = 0
VrUiDialogueInsetPct = 14
VrUiHintsScale = 1.00
VrUiHintsInsetPct = 35
VrUiHintsY = 0

; Expanded UI tab. Scale values are 1.0 = native. Y values for these Lua-backed
; elements use percent-of-screen-height conventions matching the supplied HUD adapter.
VrUiCompassScale = 1.00
VrUiCompassY = 0.0
VrUiStatsScale = 1.00
VrUiStatsX = 0.0
VrUiStatsY = 0.0
VrUiLowerScale = 1.00
VrUiLowerY = 0.0
VrUiLowerSpread = 0.0
; Experimental only: uses the supplied ratio-preset wrapper. Zoom and bars have
; separate owners; this is not claimed to fix every dialogue black-square case.
VrUiHideLetterbox = false
VrPosePredictionOffsetMs = 0.0

; Keep the old purple diagnostic path off for normal testing.
DiagnosticRendering = false

; Active D3D12 backbuffer -> OpenXR bridge. Current world content is still mono.
EnableVrOutputBridge = true

; OpenXR per-eye swapchain scale. 1.0 = runtime recommended (Quest 3 was
; 2496x2688 per eye in the recorded runtime). The F7 menu APPLY XR RES button
; requests an XR-thread swapchain rebuild. KCD2 desktop resolution is unchanged.
VrRenderScale = 1.0

; Reversible ordinary KCD2 graphics profile. It does not modify shadow cascades,
; stereo culling, TAA/history, SSR, or native stereo internals.
EnableVrBalancedGraphics = true

; V58 drives a real post-copy XR sharpening filter with this value. The balanced
; profile also keeps its existing mild native r_Sharpening floor. 0 = XR filter off.
VrEngineClarity = 0.18

; Mono bridge presentation. V58.7 defaults to Crysis-style asymmetric crop:
; use the actual published KCD2 source FOV, preserve the OpenXR angular scale,
; and do not globally squeeze the image just to hide uncovered edges.
; F5 toggles the old global-clamp path for A/B comparison only.
VrPresentationMode = 3
VrPresentationZoom = 1.0

; Manual source-FOV value used when F8 Auto Projection is OFF. F8 derives
; source coverage from live OpenXR eye tangents + the real captured source
; aspect and then feeds the measured gameplay VFOV to the compositor.
VrSourceVerticalFovDegrees = 95.0

; Small user trims layered on top of F8's automatic XR-derived correction.
; Keep at zero unless headset fit / personal optics benefit from a nudge.
VrAutoFovTrimDegrees = 0.0
VrAutoCenterYTrim = 0.0

; Historical culling-scale config is retained for compatibility, but V61.32
; preserves V61.12 gameplay-only pose-sync and does not widen culling FOV.
VrCullFrustumScale = 1.0

VrLeftOffsetX = 0.0
VrLeftOffsetY = 0.0
VrRightOffsetX = 0.0
VrRightOffsetY = 0.0

; Compatibility-only legacy generic HUD controls. V62.4 uses the semantic MovieClip
; display-info path above; these old MasterSwitch/text bridge values are not user-facing.
VrNativeUiScale = 1.00
VrDialogueTextScale = 1.00

; V61.38 release-recovery presentation selector: 0 old mono, 1 corrected mono,
; 2 fixed pseudo .90, 3 depth pseudo (near .70 -> far 1.00).
VrCleanPresentationMode = 1
; Depth-mode influence: 0 = all pixels 1.00, 1 = near pixels can reach .70.
VrDepthStereoStrength = 0.30

; F6 LOCAL/world-locked virtual-screen physical scale. V62.4 preserves the V62.1
; AUTO -> FORCE SCREEN -> FORCE IMMERSIVE -> AUTO state machine. AUTO owns startup,
; inventory/map/pause and recognized cutscene/video contexts; gameplay returns immersive.
VrFlatScreenScale = 1.70
VrFlatUiIpdMm = 0.0

; V61.45 RETIRED compatibility key. Dialogue/inventory uses the solved V60.1 fixed
; source-FOV guard. No automatic dialogue/inventory cl_fov writer is active.
VrTransientZoomRetain = 0.00

; V58.3 safety default: do not draw the MIS book back into KCD2's desktop
; backbuffer while the dedicated XR menu layer is active. V58.1 hybrid mirroring
; could be captured on a later backbuffer and appear/flicker behind the XR menu.
MirrorMisMenuToDesktop = false

; Native WHGame dialogue camera experiment:
; 0 = original/native, 1 = wh_dlg_ForcePOV, 2 = wh_dlg_NoCameras.
; Originals are captured and restored on shutdown.
VrDialogueCameraMode = 1

; Provisional Oculus/Quest Touch -> ordinary Win32 KCD2 input emulation.
; Current Quest mapping: LT=block, Left Grip=modifier, RT=attack, X=MIS book,
; Y=horse/dog, B=weapon swap/sheath family. LeftGrip+LeftStick up/down = torch/visor.
; LeftGrip+RightStick left/right = quick consumable slots; hold to drink/use.
EnableTouchBindings = true
EnableTouchAttackDirectionMouse = true

; Retained only for config compatibility. The older bow zoom heuristic stays retired.
; Dialogue/inventory no longer use any transient cl_fov compensation.
EnableBowZoomGuard = false

; V61.33: physical Insert/Home legacy stereo controls remain retired. The
; V61.30 F8 StereoL/R exact-source producer hypothesis is retired after runtime
; evidence found zero binds/pairs. F8 is now XR-derived Auto Projection.
; Native stereo remains locked in the release-facing menu.
VrStereoExperiment = 0
VrAfrIpdScale = 0.0
VrSwapEyes = false
EnableLegacyStereoProbes = false

; V61.25: retired after the +0x818/+0x828 correlation run caused choppiness.
; Future stereo work on these fields is static WHGame.dll analysis only.
EnableStereoPipelineOffsetProbe = false

; Legacy native-eye write gate. Disabled: the old selected camera-pair hypothesis
; is not treated as a proven left/right stereo pair.
EnableNativeEyeWrite = false

[Experimental]
; V62.9 VRIK ladder installs only on the validated WHGame build and starts OFF.
; Release-facing menu stays simple: NATIVE TOUCH / VRIK. F9 is a developer test ladder:
; 0 OFF -> 1 READ (zero writes) -> 2 PREBUILD HAND DELTA -> 3 PREBUILD TWO-BONE POSITIONS -> OFF.
; Modes 2/3 are bounded to 0.30 m controller-relative delta and restore selector-1 records immediately after +0x5FE2F0 consumes them.
EnableVrikSemanticOwnershipTest = true

[FutureFeatures]
EnableBodyIK = false
EnableVirtualHolsters = false
EnableMotionControls = false
EnableNativeMelee = false
EnableStaminaWeaponHandling = false
EnablePhysicalGrabbing = false
EnableNpcPhysicalReaction = false
EnablePhysicalBow = false
EnableAlchemyVR = false
EnableSmithingVR = false
DisableTargetLockSteering = false
HideCenterCursor = false
EnableWristBodyUI = false

; V61.32 combined notes:
; Optimized Defaults exposes FPS 60..120 and unified view/vegetation/merged
; distance 30..300; 120 is the proposed VR-default marker.
; F6 virtual-screen calibration: hold RIGHT GRIP + RIGHT STICK (Y=distance, X=size).
; F8 Auto Projection derives coverage/optical center from the live XR frusta.
; F9 cycles the V62.9 VRIK test ladder; start with empty hands and mode 1 READ.
; F4 is focus-driven pseudo only; the failed G-buffer wrapper scan is retired.
; V61.12 gameplay-only culling sync and GOOD MONO remain unchanged.


[Controls]
; V62.9 release-facing TARGET-key remap surface. Values are Windows Virtual-Key numbers.
; This changes which KCD2 PC key each fixed Touch action emits; arbitrary controller-chord
; reassignment is not yet implemented in this diagnostic branch.
; Common examples: W=87 A=65 S=83 D=68, Shift=160, Space=32, Esc=27, E=69, I=73, X=88, R=82, Z=90.
; Mouse attack/block remain Touch trigger -> left/right mouse for now.
MoveForwardVk = 87
MoveLeftVk = 65
MoveBackVk = 83
MoveRightVk = 68
SprintVk = 160
CrouchVk = 67
JumpVk = 32
InteractVk = 69
TorchVk = 82
VisorVk = 90
HorseDogVk = 88
InventoryVk = 73
PauseVk = 27
QuickLeftVk = 53
QuickRightVk = 54
WeaponSlot1Vk = 49
WeaponSlot2Vk = 50
